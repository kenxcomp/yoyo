<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{TITLE}} · form-base</title>
    <link rel="stylesheet" href="/assets/styles.css" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/themes/prism.min.css"
    />
    <script type="importmap">
      {
        "imports": {
          "marked": "https://cdn.jsdelivr.net/npm/marked@12/lib/marked.esm.js"
        }
      }
    </script>
    <script>
      /*__RESPONSE_DATA__*/
    </script>
  </head>
  <body>
    <main>
      <header class="fb-header">
        <h1 class="fb-title">{{TITLE}}</h1>
        <div class="fb-meta">
          <span>响应 · <code id="fb-response-id"></code></span>
          <span class="fb-role-pill" id="fb-role-pill" title="点击切换视角"></span>
        </div>
      </header>

      <article id="fb-business" class="fb-response-business"></article>

      <button
        type="button"
        id="fb-tech-toggle"
        class="fb-tech-toggle"
        hidden
        aria-expanded="false"
        aria-controls="fb-technical"
      >
        <span class="arrow">▶</span>
        <span class="label">展开技术细节(适合开发者查看)</span>
      </button>
      <section id="fb-technical" class="fb-response-technical" hidden>
        <ul id="fb-files-changed" class="fb-files-changed" hidden></ul>
        <div id="fb-technical-body"></div>
      </section>
    </main>

    <script
      src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/prism.min.js"
      data-manual
    ></script>
    <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/plugins/autoloader/prism-autoloader.min.js"></script>
    <script type="module" src="/assets/response-app.js"></script>
  </body>
</html>
